services:
  mongodb:
    image: mongo:latest
    container_name: senacampus_mongo
    restart: always
    ports:
      - "27017:27017"
    # Las credenciales se leen del archivo .env de la raíz (no se sube a GitHub).
    # Copia .env.example como .env y completa los valores antes de levantar el contenedor.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
